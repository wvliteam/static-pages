<html lang="zh-CN" data-type="software">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财经快讯 · 持仓影响汇总</title>
<style>
:root{
  --bg:#f6f8fa;--card:#ffffff;--ink:#1f2328;--sub:#656d76;--line:#d0d7de;--line-subtle:#eaeef2;
  --up:#cf222e;--upbg:#ffebe9;--upborder:#ffc1ba;
  --down:#1a7f37;--downbg:#dafbe1;--downborder:#aceebb;
  --neu:#57606a;--neubg:#f6f8fa;--neuborder:#d0d7de;
  --wait:#9a6700;--waitbg:#fff8c5;--waitborder:#f1e05a;
  --accent:#0969da;--accentbg:#ddf4ff;--accentborder:#54aeff;
  --mono:ui-monospace,SFMono-Regular,"Roboto Mono",Menlo,Monaco,Consolas,monospace;
  --radius-sm:4px;--radius:6px;--radius-lg:8px;
}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 64px;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:960px;margin:0 auto}

/* 金融等宽数字规范 */
.num,.code,.time,.price,.chg,.ref-id,table td,table th{font-variant-numeric:tabular-nums}
.code,.ref-id,.price,.chg{font-family:var(--mono)}

/* 触觉交互 */
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 页头与工具栏 */
.top-bar{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
h1{font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:-0.3px}
.lead{color:var(--sub);font-size:12.5px;margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.nodebadge{display:inline-block;background:var(--accent);color:#fff;border-radius:var(--radius-sm);padding:2px 7px;font-size:11.5px;font-weight:600}
.copy-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .12s ease}
.copy-btn:hover{background:var(--neubg);border-color:var(--sub)}
.copy-btn:active{transform:translateY(1px) scale(0.99)}

/* 首屏 Bento Grid 看板 (两栏响应式，桌面屏首屏兼顾研判与多空) */
.hero-bento{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:20px}
@media (min-width:768px){.hero-bento{grid-template-columns:1.55fr 1fr}}

.bento-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between}
.bento-t{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.bento-focus{background:var(--accentbg);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:8px 11px;font-size:13px;color:#053b82;margin-bottom:8px}
.bento-focus b{color:var(--accent)}
.bento-summary{font-size:13px;line-height:1.55;color:var(--ink)}

/* 多空势能比例条 */
.meter-box{margin:4px 0 10px}
.meter-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line-subtle);gap:1px}
.meter-seg{height:100%;transition:width .25s ease}
.meter-seg.up{background:var(--up)}.meter-seg.down{background:var(--down)}.meter-seg.wait{background:var(--wait)}.meter-seg.neu{background:var(--neu)}
.stat-chips{display:flex;flex-wrap:wrap;gap:6px}
.stat-chips span{background:var(--neubg);border:1px solid var(--line-subtle);border-radius:var(--radius-sm);padding:3px 8px;font-size:12px;font-family:var(--mono)}

/* 章节标题与工具条 */
h2{font-size:15px;font-weight:700;margin:28px 0 12px;padding-left:10px;border-left:3px solid var(--accent);display:flex;justify-content:space-between;align-items:center}
.pill-group{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.pill-btn{min-height:34px;padding:6px 12px;font-size:12px;border:none;background:none;cursor:pointer;color:var(--sub);border-right:1px solid var(--line);transition:background .1s ease}
.pill-btn:last-child{border-right:none}
.pill-btn:hover{background:var(--neubg);color:var(--ink)}
.pill-btn:active{background:var(--line-subtle)}
.pill-btn.active{background:var(--accentbg);color:var(--accent);font-weight:600}

/* 表格体系 */
.table-box{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--card)}
table{width:100%;min-width:620px;border-collapse:collapse;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:middle}
tr:last-child td{border-bottom:none}
th{background:#f6f8fa;color:var(--sub);font-weight:600;font-size:12px;letter-spacing:0.2px;white-space:nowrap}
tr.row-active{background:#fbfcfe}
tr.row-quiet{opacity:0.6}
tr:hover{background:#f4f7fb}

/* 标签体系 */
.tag{display:inline-block;border-radius:var(--radius-sm);padding:2px 7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.t-up{color:var(--up);background:var(--upbg);border:1px solid var(--upborder)}
.t-down{color:var(--down);background:var(--downbg);border:1px solid var(--downborder)}
.t-neu{color:var(--neu);background:var(--neubg);border:1px solid var(--neuborder)}
.t-wait{color:var(--wait);background:var(--waitbg);border:1px solid var(--waitborder)}

/* 真实行情快照 */
.snap{background:var(--accentbg);border:1px solid var(--accentborder);border-radius:var(--radius-lg);padding:10px 14px;margin:12px 0}
.snap-t{font-size:12.5px;font-weight:700;color:#053b82;margin-bottom:6px}
.snap table{margin:0;background:#fff;border-radius:var(--radius);overflow:hidden;min-width:100%}

/* 杂志级消息卡片 (反过度嵌套：去除多层边框) */
.msg-list{display:flex;flex-direction:column;gap:12px}
.msg{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--neu);border-radius:var(--radius-lg);padding:14px 16px;transition:transform .12s ease,border-color .12s ease}
.msg:hover{transform:translateY(-1px);border-color:#b0b8c1}
.msg.up{border-left-color:var(--up)}.msg.down{border-left-color:var(--down)}.msg.watch{border-left-color:var(--wait)}

.msg-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.msg-head-left{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.ref-id{font-weight:700;color:var(--accent);background:var(--accentbg);padding:1px 6px;border-radius:var(--radius-sm);font-size:12px}
.msg-title{font-size:14px;font-weight:700;color:var(--ink)}
.msg-time{font-size:12px;color:var(--sub);font-family:var(--mono)}

.msg-body{font-size:13.5px;color:var(--ink);margin:8px 0;line-height:1.6}

/* 传导链芯片流 (扁平化去框：使用竖线前缀与轻量流排版) */
.chain-inline{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:8px 0;padding:6px 10px;background:var(--neubg);border-left:3px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:12px}
.chain-t{color:var(--sub);font-weight:600}
.chain-node{color:var(--ink);font-weight:500}
.chain-arr{color:var(--accent);font-weight:700;font-size:11px}
.impact-line{font-size:12.5px;margin-top:6px;color:#053b82}

/* 底部元信息 */
.msg-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:11.5px;color:var(--sub);padding-top:8px;border-top:1px solid var(--line-subtle);margin-top:10px}
.msg-foot a{color:var(--accent);text-decoration:none}
.msg-foot a:hover{text-decoration:underline}
.back-link{display:inline-flex;align-items:center;min-height:28px;padding:2px 8px;font-size:11.5px;color:var(--sub);cursor:pointer;border-radius:var(--radius-sm);background:var(--neubg);border:1px solid var(--line);text-decoration:none}
.back-link:hover{background:var(--line-subtle);color:var(--ink)}

.empty{color:var(--sub);font-size:13px;padding:16px;text-align:center}
a.ref{color:var(--accent);text-decoration:none;font-weight:700;font-family:var(--mono)}
a.ref:hover{text-decoration:underline}

@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1117;--card:#161b22;--ink:#f0f6fc;--sub:#8b949e;--line:#30363d;--line-subtle:#21262d;
    --up:#f85149;--upbg:#3c1618;--upborder:#671e21;
    --down:#3fb950;--downbg:#132d1d;--downborder:#1e4b2d;
    --neu:#8b949e;--neubg:#21262d;--neuborder:#30363d;
    --wait:#d29922;--waitbg:#342308;--waitborder:#53380e;
    --accent:#2f81f7;--accentbg:#152238;--accentborder:#264168;
  }
  .stat-chips span,.pill-group,.back-link{background:#21262d}
  th{background:#161b22;color:var(--sub)}
  tr.row-active{background:#1c2333}
  tr:hover{background:#222a3d}
  .snap table{background:#161b22}.snap th{background:#21262d}
  .bento-focus{background:#152238;color:#a5cfff}
  .bento-focus b,.snap-t,.impact-line{color:#79c0ff}
  .chain-inline{background:#1f242c}
}
</style>
</head>

    up:{t:'▲ 利好',c:'t-up',k:'up'},'▲利好':{t:'▲ 利好',c:'t-up',k:'up'},
    down:{t:'▼ 利空',c:'t-down',k:'down'},'▼利空':{t:'▼ 利空',c:'t-down',k:'down'},
    neutral:{t:'● 中性',c:'t-neu',k:'neutral'},'●中性':{t:'● 中性',c:'t-neu',k:'neutral'},'●中性·分歧':{t:'● 中性',c:'t-neu',k:'neutral'},
    watch:{t:'⚠ 待观察',c:'t-wait',k:'watch'},'⚠待观察':{t:'⚠ 待观察',c:'t-wait',k:'watch'}
  };
  var NET={
    up:{t:'▲利好',c:'t-up'},'▲利好':{t:'▲利好',c:'t-up'},
    down:{t:'▼偏空',c:'t-down'},'▼偏空':{t:'▼偏空',c:'t-down'},'▼利空':{t:'▼偏空',c:'t-down'},
    neutral:{t:'●中性',c:'t-neu'},'●中性':{t:'●中性',c:'t-neu'},
    watch:{t:'⚠待观察',c:'t-wait'},'⚠待观察':{t:'⚠待观察',c:'t-wait'},
    none:{t:'—',c:'t-neu'},'—':{t:'—',c:'t-neu'}
  };
  function esc(s){return String(s==null?'':s).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c];});}
  function rl(s){return esc(s).replace(/M\d+/g,function(id){return '<a class="ref" href="#m'+id+'">'+id+'</a>';});}

  document.getElementById('lead').innerHTML=(d.node?'<span class="nodebadge">'+esc(d.node)+'</span>':'')+'时段 '+(d.period||'—')+(d.win?' ｜ 窗口 '+esc(d.win):'')+' ｜ 生成 '+(d.generatedAt||'—')+' ｜ 遵循 A 股涨红跌绿';

  var c=d.counts||{};
  var totalCount=c.total||(d.messages?d.messages.length:0);
  var totalHoldings=(d.coverage&&d.coverage.length)?d.coverage.length:9;
  var upPct=totalCount?Math.round((c.up||0)*100/totalCount):0;
  var downPct=totalCount?Math.round((c.down||0)*100/totalCount):0;
  var waitPct=totalCount?Math.round((c.watch||0)*100/totalCount):0;
  var neuPct=totalCount?Math.max(0,100-upPct-downPct-waitPct):0;

  var h='';

  // 1. 首屏 Bento Grid 看板
  h+='<div class="hero-bento">';
  h+='<div class="bento-card"><div class="bento-t"><span>时段研判定调</span><span>重点关注</span></div>';
  if(d.focus){
    h+='<div class="bento-focus"><b>🎯 核心盯紧：</b>'+esc(d.focus)+'</div>';
  }
  if(d.summary){
    h+='<div class="bento-summary"><b>态势归因：</b>'+esc(d.summary)+'</div>';
  }
  h+='</div>';

  h+='<div class="bento-card"><div class="bento-t"><span>多空势能分布</span><span>覆盖 '+esc(c.covered)+'/'+totalHoldings+' 只</span></div>';
  h+='<div class="meter-box"><div class="meter-bar">';
  if(upPct)h+='<div class="meter-seg up" style="width:'+upPct+'%" title="利好 '+upPct+'%"></div>';
  if(downPct)h+='<div class="meter-seg down" style="width:'+downPct+'%" title="利空 '+downPct+'%"></div>';
  if(waitPct)h+='<div class="meter-seg wait" style="width:'+waitPct+'%" title="待观察 '+waitPct+'%"></div>';
  if(neuPct)h+='<div class="meter-seg neu" style="width:'+neuPct+'%" title="中性 '+neuPct+'%"></div>';
  h+='</div></div>';
  h+='<div class="stat-chips"><span>共 '+esc(totalCount)+' 条</span><span style="color:var(--up);font-weight:600">▲ '+esc(c.up)+'</span><span style="color:var(--down);font-weight:600">▼ '+esc(c.down)+'</span><span>● '+esc(c.neutral)+'</span><span style="color:var(--wait);font-weight:600">⚠ '+esc(c.watch)+'</span></div></div>';
  h+='</div>';

  // 2. 真实行情快照 (若有)
  var qs=d.quotes||[];
  if(qs.length){
    h+='<div class="snap"><div class="snap-t">真实行情快照</div><div class="table-box"><table><tr><th>标的</th><th>最新/盘前价</th><th>涨跌幅</th></tr>';
    qs.forEach(function(q){
      var dc=String(q.chg||'').indexOf('-')===0?'t-down':'t-up';
      h+='<tr><td>'+esc(q.name)+' <span class="code">'+esc(q.code)+'</span></td><td class="price">'+esc(q.price)+'</td><td><span class="tag '+dc+'">'+esc(q.chg)+'</span></td></tr>';
    });
    h+='</table></div></div>';
  }

  // 3. 一眼看全：持仓速览与导航
  h+='<h2>① 持仓覆盖速览<div class="pill-group"><button class="pill-btn active" id="btn-all-cov" onclick="toggleCov(false)">全部标的 ('+totalHoldings+')</button><button class="pill-btn" id="btn-act-cov" onclick="toggleCov(true)">仅看异动标的</button></div></h2>';
  h+='<div class="table-box"><table id="cov-table"><tr><th>标的</th><th>净影响</th><th>强度</th><th>相关消息</th><th>核心逻辑</th></tr>';

  (d.coverage||[]).forEach(function(r){
    var n=NET[r.net]||NET.none;
    var isActive=(r.net&&r.net!=='none'&&r.net!=='—')||(r.refs&&r.refs!==''&&r.refs!=='—');
    h+='<tr id="cov-'+esc(r.code)+'" class="'+(isActive?'row-active':'row-quiet')+'" data-active="'+(isActive?'1':'0')+'">';
    h+='<td><span class="code">'+esc(r.code)+'</span> <b>'+esc(r.name)+'</b></td>';
    h+='<td><span class="tag '+n.c+'">'+n.t+'</span></td>';
    h+='<td>'+(r.strength?'<span class="tag '+({'强':'t-up','中':'t-wait','弱':'t-neu'}[r.strength]||'t-neu')+'">'+esc(r.strength)+'</span>':'—')+'</td>';
    h+='<td>'+rl(r.refs)+'</td>';
    h+='<td>'+esc(r.note)+'</td></tr>';
  });
  h+='</table></div>';

  // 4. 详细消息列表与即时筛选
  h+='<h2>② 市场脉络与因果传导<div class="pill-group" id="filter-group"><button class="pill-btn active" onclick="filterMsgs(\'all\')">全部 ('+totalCount+')</button><button class="pill-btn" onclick="filterMsgs(\'up\')">▲ 利好 ('+esc(c.up)+')</button><button class="pill-btn" onclick="filterMsgs(\'down\')">▼ 利空 ('+esc(c.down)+')</button><button class="pill-btn" onclick="filterMsgs(\'watch\')">⚠ 待观察 ('+esc(c.watch)+')</button></div></h2>';

  var msgs=(d.messages||[]).slice().sort(function(a,b){return String(a.time||'').localeCompare(String(b.time||''));});
  if(!msgs.length){
    h+='<div class="bento-card"><p class="empty"><b>本时段（'+(d.win||'该窗口')+'）无符合筛选条件的新增消息。</b><br>按规则未用旧消息、常识或样例填充——这是正常空结果，不是抓取失败。可能原因：该时段确无相关消息，或消息未命中关键词。请留意下一时点汇总。</p></div>';
  }else{
    h+='<div class="msg-list" id="msg-container">';
    msgs.forEach(function(m){
      var g=DIR[m.dir]||DIR.neutral;
      var safeUrl=(m.url&&/^https?:\/\//i.test(m.url))?esc(m.url):'';
      var dirKey=g.k||'neutral';

      // 扁平化传导链排版 (去除嵌套边框)
      var chainHtml='';
      if(m.chain){
        var parts=String(m.chain).split(/->|➔|=>|→/).map(function(s){return s.trim();}).filter(Boolean);
        if(parts.length>1){
          chainHtml='<div class="chain-inline"><span class="chain-t">传导链：</span>';
          parts.forEach(function(pt,idx){
            chainHtml+='<span class="chain-node">'+esc(pt)+'</span>';
            if(idx<parts.length-1) chainHtml+='<span class="chain-arr">➔</span>';
          });
          chainHtml+='</div>';
        }else{
          chainHtml='<div class="chain-inline"><span class="chain-t">传导链：</span><span class="chain-node">'+esc(m.chain)+'</span></div>';
        }
      }

      h+='<div class="msg '+dirKey+'" id="m'+esc(m.id)+'" data-dir="'+dirKey+'">';
      h+='<div class="msg-head"><div class="msg-head-left"><span class="ref-id">'+esc(m.id)+'</span><span class="tag '+g.c+'">'+g.t+(m.strength?' · '+esc(m.strength):'')+'</span><span class="msg-title">关联：'+esc(m.codes)+'</span>'+(m.nature?'<span class="tag t-neu">'+esc(m.nature)+'</span>':'')+'</div>';
      h+='<div class="msg-time">'+esc(m.time)+(m.asof?' (行情:'+esc(m.asof)+')':'')+'</div></div>';
      h+='<div class="msg-body">'+esc(m.content)+'</div>';
      if(chainHtml) h+=chainHtml;
      if(m.impact) h+='<div class="impact-line"><b>影响判定：</b>'+esc(m.impact)+'</div>';
      h+='<div class="msg-foot"><div>来源：'+esc(m.source)+(safeUrl?' ｜ <a href="'+safeUrl+'" target="_blank" rel="noopener">查看原文 ↗</a>':'')+' ｜ 核实：'+esc(m.verify)+'</div>';
      h+='<a class="back-link" href="#cov-table">↑ 返回速览表</a></div></div>';
    });
    h+='</div>';
  }

  // 5. 结尾声明
  if(d.notice)h+='<p class="empty">'+esc(d.notice)+'</p>';
  h+='<p class="empty" style="margin-top:24px">以上为公开信息汇总，不构成投资建议。</p>';
  document.getElementById('app').innerHTML=h;

  // 复制速报
  window.copyBrief=function(){
    var txt='【财经快讯 · 持仓影响汇总 ('+(d.period||'')+')】\n';
    if(d.focus) txt+='🎯 核心盯紧：'+d.focus+'\n';
    if(d.summary) txt+='📊 态势归因：'+d.summary+'\n';
    txt+='----------------------------\n';
    txt+='覆盖标的速览：\n';
    (d.coverage||[]).forEach(function(r){
      var n=NET[r.net]||NET.none;
      if(r.net!=='none'&&r.net!=='—'){
        txt+='• '+r.code+' '+r.name+'：'+n.t+(r.strength?'·'+r.strength:'')+' ｜ '+r.note+'\n';
      }
    });
    txt+='----------------------------\n以上为公开信息汇总，不构成投资建议。';

    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        var btn=document.getElementById('btn-copy');
        var old=btn.innerText;
        btn.innerText='✓ 已复制速报';
        setTimeout(function(){btn.innerText=old;},2000);
      });
    }else{
      alert('已生成文本简报，请全选复制：\n\n'+txt);
    }
  };

  // 异动过滤
  window.toggleCov=function(onlyActive){
    document.getElementById('btn-all-cov').className='pill-btn '+(onlyActive?'':'active');
    document.getElementById('btn-act-cov').className='pill-btn '+(onlyActive?'active':'');
    var rows=document.querySelectorAll('#cov-table tr[data-active]');
    rows.forEach(function(r){
      if(onlyActive){
        r.style.display=r.getAttribute('data-active')==='1'?'':'none';
      }else{
        r.style.display='';
      }
    });
  };

  // 即时多空筛选
  window.filterMsgs=function(cat){
    var btns=document.querySelectorAll('#filter-group .pill-btn');
    btns.forEach(function(b){b.classList.remove('active');});
    if(event&&event.target) event.target.classList.add('active');
    var cards=document.querySelectorAll('#msg-container .msg');
    cards.forEach(function(card){
      if(cat==='all'||card.getAttribute('data-dir')===cat){
        card.style.display='';
      }else{
        card.style.display='none';
      }
    });
  };
})();
</script>
</body>
</html>
