<html lang="zh-CN">

<title>财经快讯 · 专业盯盘座舱</title>
<style>
:root{
  --bg:#f3f0ea;--card:#fffdf9;--card-subtle:#f8f5ef;--ink:#172333;--sub:#66717d;
  --line:#d7d1c7;--line-subtle:#ebe6de;
  --up:#b42318;--upbg:#fcedeb;--upborder:#e7b9b3;
  --down:#26734d;--downbg:#e8f3ec;--downborder:#b8d7c3;
  --neu:#5f6974;--neubg:#f3f0ea;--neuborder:#d7d1c7;
  --wait:#906b1b;--waitbg:#f8f1dc;--waitborder:#ddc889;
  --accent:#173f5f;--accentbg:#e8f0f4;--accentborder:#b6ccd8;
  --purple:#725567;--purplebg:#f2eaf0;--purpleborder:#d9c1d0;
  --live:#1a7f37;--livebg:#dafbe1;
  --mono:ui-monospace,SFMono-Regular,"Roboto Mono",Menlo,Monaco,Consolas,monospace;
  --radius-sm:3px;--radius:6px;--radius-lg:8px;
  --shadow:0 1px 2px rgba(23,35,51,.05),0 5px 18px rgba(23,35,51,.035);
  --display:ui-serif,Georgia,"Songti SC","STSong",serif;
}

*{box-sizing:border-box}
body{
  margin:0;padding:18px 16px 56px;background:var(--bg);color:var(--ink);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto}

/* 金融等宽数字 */
.num,.code,.time,.price,.chg{font-variant-numeric:tabular-nums;font-family:var(--mono)}

/* 顶部标题区 (紧凑纯净) */
.top-header{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;padding:0 0 11px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
.main-title{font-family:var(--display);font-size:22px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:-0.4px}
.node-badge{background:var(--accent);color:#fff;padding:4px 7px;border-radius:var(--radius-sm);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.02em}
.header-meta{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:8px}

.btn-copy{
  background:transparent;border:1px solid var(--accent);border-radius:var(--radius-sm);
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  width:28px;height:28px;padding:0;color:var(--accent);cursor:pointer;
  transition:all .12s ease;
}
.btn-copy:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 状态徽标 (State Badges) */
.badge{display:inline-block;border-radius:var(--radius-sm);padding:2px 5px;font-size:10px;font-weight:600;white-space:nowrap;line-height:1.25}
.b-live{background:var(--livebg);color:var(--live);border:1px solid var(--downborder)}
.b-pre{background:var(--waitbg);color:var(--wait);border:1px solid var(--waitborder)}
.b-closed{background:var(--neubg);color:var(--sub);border:1px solid var(--line)}
.b-history{background:var(--purplebg);color:var(--purple);border:1px solid var(--purpleborder)}

.tag-up{color:var(--up);background:var(--upbg);border:1px solid var(--upborder);font-weight:700}
.tag-down{color:var(--down);background:var(--downbg);border:1px solid var(--downborder);font-weight:700}
.tag-neu{color:var(--neu);background:var(--neubg);border:1px solid var(--neuborder)}

.dot-live{width:5px;height:5px;border-radius:50%;background:var(--live);display:inline-block;animation:pulse-dot 1.8s infinite}
@keyframes pulse-dot{
  0%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(26,127,55,0.7)}
  70%{transform:scale(1);box-shadow:0 0 0 3px rgba(26,127,55,0)}
  100%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(26,127,55,0)}
}

/* 章节通用标题 */
.sec-head{
  font-family:var(--display);font-size:15px;font-weight:700;margin:18px 0 8px;padding:0 0 6px;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px;
}
.sec-head > span:first-child{display:flex;align-items:center;gap:7px}
.sec-head > span:first-child::before{content:"";width:4px;height:15px;background:var(--accent);display:inline-block;border-radius:1px}
.sec-head > span:last-child{font-family:inherit;font-size:11px!important;font-weight:500;color:var(--sub)!important;white-space:nowrap;
}

/* 1. 首屏决策黄金区：A股推演攻守矩阵 (精炼高密度) */
.hero-matrix{
  background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);
  border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow);
}
.hero-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--line-subtle)}
.hero-title{font-family:var(--display);font-size:16px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:4px}

.decision-bullets{display:flex;flex-direction:column;gap:4px}
.d-bullet{
  display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.5;
  padding:7px 9px;border-radius:var(--radius-sm);background:var(--card-subtle);border-left:2px solid var(--accent);
}
.d-bullet.alert{background:var(--upbg);border-left-color:var(--up);color:var(--ink)}
.d-tag{font-weight:800;font-size:11px;flex-shrink:0;white-space:nowrap;color:var(--accent)}

/* 2. 多Tab式全球核心指数看板 (超紧凑节省75%纵向空间) */
.idx-tab-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:10px;
}
.idx-tabs{
  display:flex;background:var(--card-subtle);border-bottom:1px solid var(--line);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.idx-tabs::-webkit-scrollbar{display:none}
.idx-tab{
  flex:1;min-width:68px;min-height:44px;padding:7px 4px;font-size:12px;font-weight:700;color:var(--sub);border:none;background:none;
  cursor:pointer;border-bottom:2px solid transparent;text-align:center;white-space:nowrap;transition:all .1s ease;
}
.idx-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--card);box-shadow:inset 0 -1px 0 var(--accent)}

.idx-pane{padding:8px 10px;display:none}
.idx-pane.active{display:block}
.idx-pane-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.idx-pane-name{font-size:11.5px;font-weight:800;color:var(--ink)}

.idx-chips-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:6px}
.t-chip{
  background:transparent;border:0;border-bottom:1px solid var(--line-subtle);border-radius:0;
  padding:7px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.t-chip-left{display:flex;flex-direction:column}
.t-chip-name{font-weight:700;font-size:11px;color:var(--ink)}
.t-chip-price{font-size:12px;font-weight:800;color:var(--ink);font-family:var(--mono)}

/* 3. 重点板块与核心个股异动 */
.focus-board{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow);
}
.focus-sec-title{font-family:var(--display);font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.sector-pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.sector-pill{
  display:inline-flex;align-items:center;gap:3px;background:var(--card-subtle);
  border:1px solid var(--line-subtle);border-radius:var(--radius-sm);padding:2px 6px;font-size:11px;
}

.stock-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));column-gap:12px;row-gap:0}
.s-mini-card{
  background:transparent;border:0;border-bottom:1px solid var(--line-subtle);border-radius:0;
  padding:7px 3px;display:flex;flex-direction:column;gap:3px;
}
.s-mini-top{display:flex;justify-content:space-between;align-items:baseline}
.s-mini-name{font-weight:700;font-size:11.5px;color:var(--ink)}
.s-mini-bot{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--sub)}

/* 4. 持仓全景透视 (Tab 切换卡片) */
.cockpit-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.cockpit-tabs{display:flex;background:var(--card-subtle);border-bottom:1px solid var(--line)}
.cockpit-tab{
  flex:1;min-height:44px;padding:7px;font-size:11.5px;font-weight:700;color:var(--sub);border:none;background:none;
  cursor:pointer;border-bottom:2px solid transparent;text-align:center;
}
.cockpit-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--card)}
.cockpit-content{padding:8px 10px}

/* 个股卡片行 */
.stock-card-row{
  background:var(--card);border:0;border-bottom:1px solid var(--line-subtle);border-radius:0;
  padding:8px 2px;margin-bottom:0;display:flex;flex-direction:column;gap:3px;
}
.stock-card-row:last-child{margin-bottom:0}
.stock-line-1{display:flex;justify-content:space-between;align-items:baseline}
.stock-line-2{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--sub);flex-wrap:wrap;gap:4px}
.stock-hint{font-size:10.5px;color:var(--sub);background:var(--card-subtle);padding:2px 5px;border-radius:3px;margin-top:2px}

/* ETF 穿透模块 (纯 CSS 变量暗黑适配) */
.etf-block{
  background:var(--card-subtle);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:8px;margin-bottom:6px;display:flex;flex-direction:column;gap:4px;
}
.etf-block:last-child{margin-bottom:0}
.etf-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.etf-title{font-size:12px;font-weight:800;color:var(--ink)}
.etf-driving{font-size:11px;color:var(--ink);line-height:1.35}
.etf-chips{display:flex;flex-wrap:wrap;gap:4px}
.holding-chip{
  display:inline-flex;align-items:center;gap:3px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px 5px;font-size:10.5px;color:var(--ink);
}

/* 5. 影响市场的重大消息 (不求全而求精) */
.major-news-list{display:flex;flex-direction:column;gap:6px}
.news-item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:11px 13px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow);
}
.news-item.impact-high{border-left:3px solid var(--up)}
.news-item.impact-med{border-left:2px solid var(--accent)}

.news-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:3px 8px}
.news-title{flex:1 1 240px;min-width:0;font-size:12px;font-weight:800;color:var(--ink);overflow-wrap:anywhere}
.news-meta{flex:0 1 auto;min-width:0;max-width:100%;font-size:10.5px;color:var(--sub);white-space:normal;overflow-wrap:anywhere}
.news-meta a{white-space:nowrap}
.news-body{font-size:12px;line-height:1.5;color:var(--ink)}
.news-detail summary{
  display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;list-style:none;
  color:var(--sub);font-size:12px;line-height:1.4;touch-action:manipulation;
}
.news-detail summary::-webkit-details-marker{display:none}
.news-detail summary:focus-visible,.live-news-toggle:focus-visible,.idx-tab:focus-visible,.cockpit-tab:focus-visible,.btn-copy:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
.news-preview{flex:1;min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;color:var(--ink)}
.news-detail-toggle{flex:none;white-space:nowrap;color:var(--accent);font-weight:700}
.news-detail-toggle-close{display:none}
.news-detail[open] .news-detail-toggle-open{display:none}
.news-detail[open] .news-detail-toggle-close{display:inline}
.news-detail-content{display:flex;flex-direction:column;gap:3px;padding-top:3px}
.live-news-toggle{display:flex;align-items:center;min-height:44px;cursor:pointer;touch-action:manipulation}
.news-impact{
  display:flex;align-items:flex-start;gap:6px;font-size:11px;background:transparent;
  padding:5px 0 0;border-top:1px solid var(--line-subtle);border-radius:0;color:var(--ink);
}
.news-impact-label{flex:none;white-space:nowrap}
.news-impact-text{flex:1;min-width:0;overflow-wrap:anywhere}
.chain-inline{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:2px;font-size:10.5px;color:var(--sub)}

@media (max-width:600px){
  .stock-grid{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:7px;row-gap:4px}
  .s-mini-card{background:var(--card-subtle);border:1px solid var(--line-subtle);border-radius:var(--radius-sm);padding:6px}
  .news-top{flex-direction:column;align-items:stretch}
  .news-title,.news-meta{flex:none;width:100%}
  .d-bullet{font-size:13px;line-height:1.5}
  .d-tag{font-size:12px}
  .news-title{font-size:13px}
  .news-meta{font-size:11px}
  .news-body{font-size:13px;line-height:1.5}
  .news-impact{font-size:12px;line-height:1.45}
  .chain-inline{font-size:11px}
}

/* 暗色模式适配 (Dark Mode) - 纯 CSS 变量映射 */
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111923;--card:#18232e;--card-subtle:#1d2935;--ink:#e9edf0;--sub:#9aa6af;
    --line:#34424e;--line-subtle:#293642;
    --up:#f0786e;--upbg:#352423;--upborder:#6c3934;
    --down:#75bd91;--downbg:#20352a;--downborder:#385a43;
    --neu:#a1abb3;--neubg:#202b36;--neuborder:#394651;
    --wait:#d7b66d;--waitbg:#332f22;--waitborder:#625538;
    --accent:#9bbbd0;--accentbg:#233542;--accentborder:#496477;
    --purple:#c4a1bb;--purplebg:#302733;--purpleborder:#594553;
    --live:#75bd91;--livebg:#20352a;
  }
  body{background:var(--bg);color:var(--ink)}
  .d-bullet.alert{color:#ffb4ab}
}

@media (min-width:960px){
  body{padding-left:28px;padding-right:28px}
  .overview-grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);align-items:start;gap:0 22px}
  .overview-grid .hero-matrix{grid-column:1;grid-row:1 / span 2}
  .overview-grid .sec-head{grid-column:2;margin-top:0}
  .overview-grid .idx-tab-card{grid-column:2;margin-bottom:0}
  .stock-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .major-news-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
}
</style>

      "content": "【广东：到2030年全域智算规模力争达到4000EFlops】11月26日，广东省政务服务和数据管理局和广东省发展和改革委员会印发《广东省算力发展“十五五”规划》（简称《规划》）。《规划》明确，到2028年，广东算力发展取得重要阶段性成效，智算规模突破1000EFlops（FP16），全省数据中心绿电使用占比超80%，新建大型及以上数据中心电能利用效率（PUE）小于1.2，存量数据中心能效显著提升，绿色低碳发展达到全国先进水平，边缘智算深入推进，算力设施建设布局持续优化，算力网络时延进一步降低，数算电网一体化协同建设水平显著提升，基本建成国际一流、国内领先的算力高地。到2030年，广东全域智算规模超2500EFlops（FP16），力争达到4000EFlops（FP16），算力供给结构深度适配新兴产业、未来产业发展，粤港澳大湾区一体化算力网络基本成型见效，韶关集群到全省主要城市网络时延在5毫秒以内，粤港澳跨境算力走廊建设取得突破性进展，绿电消费比例进一步提升，数算电网一体化协同发展机制成熟完善，前沿太空算力等未来技术布局抢占先机，粤港澳大湾区城市群算力发展水平引领全球。",

      "content": "【首创期货：跌停潮后弱势延续，碳酸锂远月再跌逾3%，逼近8万】昨日碳酸锂主力2701合约暴跌8.08% 收报82620元 / 吨、创年内新低，今日盘面延续弱势，LC2706合约午间报80520元 / 吨、跌3.10%，盘中最低触及80520元；叠加今日氢氧化锂期货上市首日大跌6.56%，锂盐板块悲观情绪持续发酵，现货价格跟盘偏弱、下游以刚需采购为主。供应端宽松压力未减，数据显示本周碳酸锂周度产量环比增加340吨、重回增长，锂辉石到厂后盐厂产量爬升，头部云母矿山复产带动一体化产能释放，Mysteel预计11月国内碳酸锂产量约12.18万吨、环比增3.5%，江西枧下窝复产预期仍在发酵。需求端利空集中：12月电池排产环比大降17.6% 至266GWh，欧盟对中国电动车实行配额制、混动首年配额仅35万辆，下调明年出口动力需求预期。综合来看，供应增量与需求转弱共振，碳酸锂中期宽松格局未改，短期超跌后8万关口或有实货承接，但反弹动力不足，不排除在供应持续增长，需求走弱下，进一步下跌的可能。（首创期货）",

      "title": "金价大跌，桥水基金创始人达利欧最新发声",
      "content": "【金价大跌，桥水基金创始人达利欧最新发声】亿万富翁、桥水基金创始人瑞·达利欧近日表示，黄金作为投资者投资组合中不可替代的有效分散投资工具，无论处于投资周期的哪个阶段，将其配置比例控制在10%至15%都是明智之举。据知名贵金属资讯网站Kitco News当地时间25日报道，在最近的一次采访中，达利欧表示，投资者首先要明确自己需要多少资金才能维持生活稳定，并通过安全、多元化的投资来确保这一数额。  “在评估自己的资金规模时，必须考虑扣除通胀后的实际回报，因为你储存的是购买力。”达利欧表示，下一步是预估通胀将平均侵蚀你投资价值的约3%，同时还要为资产价值下跌50%的最坏情况做好准备。达利欧强调了在投资组合中持有黄金作为防御性资产的重要性。“当信贷体系正常时，大多数金融市场表现良好。”他说，“当信贷体系不正常、债务过多且存在重大问题时，黄金是一种有效的分散投资工具。因此，黄金应作为分散投资工具纳入投资组合。”“那么，具体比例是多少？我认为应该在10%到15%之间。”他说，“如果你持有传统投资组合，其中约有10%至15%配置在黄金上，那么当那种糟糕的时期来临时，你的投资组合将得到良好的分散。无论你预期市场好坏，在投资组合中配置10%至15%的黄金都是明智之举。”（中新经纬）",

      }
      if(m.impact){
        h += '    <div class="news-impact"><b class="news-impact-label">A股影响</b><span class="news-impact-text">' + esc(m.impact) + '</span></div>';
      }
      h += '  </div>';
    });
  }
  h += '</div>';

  // 6.1 可折叠 7x24 实时要闻明细（全量溯源）
  var liveNews = d.news || [];
  if(liveNews.length){
    h += '<details style="margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px">';
    h += '  <summary class="live-news-toggle" style="font-size:12px;font-weight:700;color:var(--ink)">7x24 实时快讯原始流溯源（共 ' + esc(liveNews.length) + ' 条，点击展开）</summary>';
    h += '  <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">';
    liveNews.forEach(function(n){
      var nUrl = (n.url && /^https?:\/\//i.test(n.url)) ? esc(n.url) : '';
      var nTag = n.codes ? ' <span class="badge tag-neu">' + esc(n.codes) + '</span>' : '';
      h += '    <div style="font-size:12px;line-height:1.5;padding:7px 8px;background:var(--card-subtle);border-radius:var(--radius-sm)">';
      h += '      <div style="display:flex;justify-content:space-between;gap:6px;margin-bottom:2px;color:var(--sub);font-size:11px"><span>[' + esc(n.time || '') + '] ' + esc(n.source || '') + nTag + '</span>' + (nUrl ? '<a href="' + nUrl + '" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">原文↗</a>' : '') + '</div>';
      h += '      <div>' + esc(n.content || '') + '</div>';
      h += '    </div>';
    });
    h += '  </div>';
    h += '</details>';
  }else{
    h += '<div style="margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:11px;color:var(--sub)">7x24 实时快讯原始流溯源：本时段无增量直接快讯，已切换为纯盘面量价与外盘估值跟踪模式。</div>';
  }

  // 7. 尾部声明与免责
  h += '<div style="margin-top:20px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--sub);text-align:center">';
  h += '  财经快讯 · 实时行情与公开信息整理 ｜ 仅供投研参考，不构成投资建议。';
  h += '</div>';

  document.getElementById('app').innerHTML = h;

  // 全局交互函数绑定
  window.switchIdx = function(paneId){
    var panes = document.querySelectorAll('.idx-pane');
    panes.forEach(function(p){ p.classList.remove('active'); });
    var target = document.getElementById(paneId);
    if(target) target.classList.add('active');

    var tabs = document.querySelectorAll('.idx-tab');
    tabs.forEach(function(t){ t.classList.remove('active'); });
    if(window.event && window.event.currentTarget){
      window.event.currentTarget.classList.add('active');
    }
  };

  window.switchPortTab = function(tabId){
    var sTab = document.getElementById('tab-stocks');
    var eTab = document.getElementById('tab-etfs');
    if(sTab) sTab.style.display = (tabId === 'tab-stocks' ? 'block' : 'none');
    if(eTab) eTab.style.display = (tabId === 'tab-etfs' ? 'block' : 'none');
    var tabs = document.querySelectorAll('.cockpit-tab');
    if(tabs.length >= 2){
      tabs[0].classList.toggle('active', tabId === 'tab-stocks');
      tabs[1].classList.toggle('active', tabId === 'tab-etfs');
    }
  };

  window.copyBrief = function(){
    var txt = '【财经快讯 · 盯盘与预测 (' + (d.node || '') + ' ' + (d.period || '') + ')】\n';
    if(d.focus) txt += '核心定调：' + d.focus + '\n';
    if(d.summary) txt += '态势归因：' + d.summary + '\n';
    txt += '----------------------------\n';
    (d.messages || []).forEach(function(m){
      txt += '• [' + (m.codes || '要闻') + '] ' + (m.impact || m.content) + '\n';
    });
    txt += '----------------------------\n公网研报：https://pages.242556.xyz/\n以上为公开信息汇总，仅供参考。';

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        var btn = document.getElementById('btn-copy');
        if(btn){
          btn.innerHTML = copiedIcon;
          btn.setAttribute('aria-label', '已复制');
          btn.title = '已复制';
          clearTimeout(copyResetTimer);
          copyResetTimer = setTimeout(function(){
            btn.innerHTML = copyIcon;
            btn.setAttribute('aria-label', '复制速报');
            btn.title = '复制速报';
          }, 2000);
        }
      });
    }else{
      alert('已生成速报文本：\n\n' + txt);
    }
  };
})();
</script>
</body>
</html>
