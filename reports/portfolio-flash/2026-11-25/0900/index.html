<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>财经快讯 · 专业盯盘座舱</title>
<style>
:root{
  --bg:#f6f8fa;--card:#ffffff;--card-subtle:#f8f9fa;--ink:#1f2328;--sub:#656d76;
  --line:#d0d7de;--line-subtle:#eaeef2;
  --up:#cf222e;--upbg:#ffebe9;--upborder:#ffc1ba;
  --down:#1a7f37;--downbg:#dafbe1;--downborder:#aceebb;
  --neu:#57606a;--neubg:#f6f8fa;--neuborder:#d0d7de;
  --wait:#9a6700;--waitbg:#fff8c5;--waitborder:#f1e05a;
  --accent:#0969da;--accentbg:#ddf4ff;--accentborder:#54aeff;
  --purple:#8250df;--purplebg:#fbefff;--purpleborder:#e8c6ff;
  --live:#1a7f37;--livebg:#dafbe1;
  --mono:ui-monospace,SFMono-Regular,"Roboto Mono",Menlo,Monaco,Consolas,monospace;
  --radius-sm:4px;--radius:8px;--radius-lg:10px;
}

*{box-sizing:border-box}
body{
  margin:0;padding:10px 10px 50px;background:var(--bg);color:var(--ink);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:880px;margin:0 auto}

/* 金融等宽数字 */
.num,.code,.time,.price,.chg{font-variant-numeric:tabular-nums;font-family:var(--mono)}

/* 顶部标题区 (紧凑纯净) */
.top-header{display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px;flex-wrap:wrap;gap:6px}
.main-title{font-size:17px;font-weight:800;margin:0;display:flex;align-items:center;gap:6px;letter-spacing:-0.3px}
.node-badge{background:var(--accent);color:#fff;padding:2px 6px;border-radius:var(--radius-sm);font-size:11px;font-weight:700}
.header-meta{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:8px}

.btn-copy{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:2px 7px;font-size:11px;color:var(--ink);cursor:pointer;font-weight:600;
  transition:all .12s ease;
}
.btn-copy:hover{background:var(--card-subtle);border-color:var(--sub)}

/* 状态徽标 (State Badges) */
.badge{display:inline-block;border-radius:var(--radius-sm);padding:1px 5px;font-size:10px;font-weight:600;white-space:nowrap;line-height:1.3}
.b-live{background:var(--livebg);color:var(--live);border:1px solid var(--downborder)}
.b-pre{background:var(--waitbg);color:var(--wait);border:1px solid var(--waitborder)}
.b-closed{background:var(--neubg);color:var(--sub);border:1px solid var(--line)}
.b-history{background:var(--purplebg);color:var(--purple);border:1px solid var(--purpleborder)}

.tag-up{color:var(--up);background:var(--upbg);border:1px solid var(--upborder);font-weight:700}
.tag-down{color:var(--down);background:var(--downbg);border:1px solid var(--downborder);font-weight:700}
.tag-neu{color:var(--neu);background:var(--neubg);border:1px solid var(--neuborder)}

.dot-live{width:5px;height:5px;border-radius:50%;background:var(--live);display:inline-block;animation:pulse-dot 1.8s infinite}
@keyframes pulse-dot{
  0%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(26,127,55,0.7)}
  70%{transform:scale(1);box-shadow:0 0 0 3px rgba(26,127,55,0)}
  100%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(26,127,55,0)}
}

/* 章节通用标题 */
.sec-head{
  font-size:12.5px;font-weight:800;margin:12px 0 6px;padding-left:7px;border-left:3px solid var(--accent);
  display:flex;justify-content:space-between;align-items:center;
}

/* 1. 首屏决策黄金区：A股推演攻守矩阵 (精炼高密度) */
.hero-matrix{
  background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);
  border-radius:var(--radius-lg);padding:8px 10px;margin-bottom:10px;
}
.hero-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line-subtle)}
.hero-title{font-size:12.5px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:4px}

.decision-bullets{display:flex;flex-direction:column;gap:4px}
.d-bullet{
  display:flex;align-items:flex-start;gap:6px;font-size:11.5px;line-height:1.4;
  padding:5px 8px;border-radius:var(--radius-sm);background:var(--card-subtle);border-left:3px solid var(--accent);
}
.d-bullet.alert{background:var(--upbg);border-left-color:var(--up);color:var(--ink)}
.d-tag{font-weight:800;font-size:11px;flex-shrink:0;white-space:nowrap}

/* 2. 多Tab式全球核心指数看板 (超紧凑节省75%纵向空间) */
.idx-tab-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  overflow:hidden;margin-bottom:10px;
}
.idx-tabs{
  display:flex;background:var(--card-subtle);border-bottom:1px solid var(--line);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.idx-tabs::-webkit-scrollbar{display:none}
.idx-tab{
  flex:1;min-width:68px;padding:7px 4px;font-size:12px;font-weight:700;color:var(--sub);border:none;background:none;
  cursor:pointer;border-bottom:2px solid transparent;text-align:center;white-space:nowrap;transition:all .1s ease;
}
.idx-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--card)}

.idx-pane{padding:8px 10px;display:none}
.idx-pane.active{display:block}
.idx-pane-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.idx-pane-name{font-size:11.5px;font-weight:800;color:var(--ink)}

.idx-chips-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:6px}
.t-chip{
  background:var(--card-subtle);border:1px solid var(--line-subtle);border-radius:var(--radius-sm);
  padding:5px 7px;display:flex;justify-content:space-between;align-items:center;gap:4px;
}
.t-chip-left{display:flex;flex-direction:column}
.t-chip-name{font-weight:700;font-size:11px;color:var(--ink)}
.t-chip-price{font-size:12px;font-weight:800;color:var(--ink);font-family:var(--mono)}

/* 3. 重点板块与核心个股异动 */
.focus-board{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 10px;margin-bottom:10px;
}
.focus-sec-title{font-size:11px;font-weight:800;color:var(--sub);margin-bottom:5px;display:flex;align-items:center;gap:4px}
.sector-pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.sector-pill{
  display:inline-flex;align-items:center;gap:3px;background:var(--card-subtle);
  border:1px solid var(--line-subtle);border-radius:var(--radius-sm);padding:2px 6px;font-size:11px;
}

.stock-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));gap:5px}
.s-mini-card{
  background:var(--card-subtle);border:1px solid var(--line-subtle);border-radius:var(--radius-sm);
  padding:5px 7px;display:flex;flex-direction:column;gap:2px;
}
.s-mini-top{display:flex;justify-content:space-between;align-items:baseline}
.s-mini-name{font-weight:700;font-size:11.5px;color:var(--ink)}
.s-mini-bot{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--sub)}

/* 4. 持仓全景透视 (Tab 切换卡片) */
.cockpit-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:10px;overflow:hidden}
.cockpit-tabs{display:flex;background:var(--card-subtle);border-bottom:1px solid var(--line)}
.cockpit-tab{
  flex:1;padding:7px;font-size:11.5px;font-weight:700;color:var(--sub);border:none;background:none;
  cursor:pointer;border-bottom:2px solid transparent;text-align:center;
}
.cockpit-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--card)}
.cockpit-content{padding:8px 10px}

/* 个股卡片行 */
.stock-card-row{
  background:var(--card);border:1px solid var(--line-subtle);border-radius:var(--radius-sm);
  padding:6px 8px;margin-bottom:5px;display:flex;flex-direction:column;gap:2px;
}
.stock-card-row:last-child{margin-bottom:0}
.stock-line-1{display:flex;justify-content:space-between;align-items:baseline}
.stock-line-2{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--sub);flex-wrap:wrap;gap:4px}
.stock-hint{font-size:10.5px;color:var(--sub);background:var(--card-subtle);padding:2px 5px;border-radius:3px;margin-top:2px}

/* ETF 穿透模块 (纯 CSS 变量暗黑适配) */
.etf-block{
  background:var(--card-subtle);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px;margin-bottom:6px;display:flex;flex-direction:column;gap:4px;
}
.etf-block:last-child{margin-bottom:0}
.etf-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.etf-title{font-size:12px;font-weight:800;color:var(--ink)}
.etf-driving{font-size:11px;color:var(--ink);line-height:1.35}
.etf-chips{display:flex;flex-wrap:wrap;gap:4px}
.holding-chip{
  display:inline-flex;align-items:center;gap:3px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px 5px;font-size:10.5px;color:var(--ink);
}

/* 5. 影响市场的重大消息 (不求全而求精) */
.major-news-list{display:flex;flex-direction:column;gap:6px}
.news-item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 10px;display:flex;flex-direction:column;gap:3px;
}
.news-item.impact-high{border-left:3px solid var(--up)}
.news-item.impact-med{border-left:3px solid var(--accent)}

.news-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.news-title{font-size:12px;font-weight:800;color:var(--ink)}
.news-meta{font-size:10.5px;color:var(--sub);white-space:nowrap}
.news-body{font-size:11.5px;line-height:1.45;color:var(--ink)}
.news-impact{
  display:flex;align-items:center;gap:4px;font-size:11px;background:var(--card-subtle);
  padding:3px 6px;border-radius:var(--radius-sm);color:var(--ink);
}
.chain-inline{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:2px;font-size:10.5px;color:var(--sub)}

/* 暗色模式适配 (Dark Mode) - 纯 CSS 变量映射 */
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1117;--card:#161b22;--card-subtle:#1c2128;--ink:#f0f6fc;--sub:#8b949e;
    --line:#30363d;--line-subtle:#21262d;
    --up:#f85149;--upbg:#3c1618;--upborder:#671e21;
    --down:#3fb950;--downbg:#132d1d;--downborder:#1e4b2d;
    --neu:#8b949e;--neubg:#21262d;--neuborder:#30363d;
    --wait:#d29922;--waitbg:#342308;--waitborder:#53380e;
    --accent:#58a6ff;--accentbg:#152238;--accentborder:#264168;
    --purple:#bc8cff;--purplebg:#271033;--purpleborder:#532073;
    --live:#3fb950;--livebg:#132d1d;
  }
  body{background:var(--bg);color:var(--ink)}
  .d-bullet.alert{color:#ffb4ab}
}
</style>

    return /^(50|51|52|56|58|15|16|18)/.test(raw);
  }
  var heldStocks = quotesList.filter(function(q){ return !isEtfCode(q.code); });
  var heldEtfs = quotesList.filter(function(q){ return isEtfCode(q.code); });

  h += '<div class="sec-head">';
  h += '  <span>🔥 重点关注板块与持仓异动</span>';
  h += '  <span style="font-size:11px;color:var(--sub);font-weight:normal">真实持仓强弱 ｜ 动态基准联动</span>';
  h += '</div>';

  h += '<div class="focus-board">';
  h += '  <div class="focus-sec-title">🎯 持仓关联赛道与基准强弱追踪</div>';
  h += '  <div class="sector-pills">';

  var seenSectors = {};
  var sectorPillsHtml = '';
  ssList.forEach(function(s){
    var secKey = s.sector_code || s.sector_name;
    if(secKey && !seenSectors[secKey]){
      seenSectors[secKey] = true;
      var label = (s.industry || s.sector_name || '');
      sectorPillsHtml += '    <div class="sector-pill"><b>' + esc(label) + '</b> <span style="font-size:10px;color:var(--sub)">(' + esc(s.sector_name) + ')</span> <span class="badge ' + getChgTag(s.sector_chg) + '" style="margin-left:2px">' + esc(s.sector_chg) + '</span></div>';
    }
  });
  etfList.forEach(function(etf){
    if(etf.etf_code && !seenSectors[etf.etf_code]){
      seenSectors[etf.etf_code] = true;
      sectorPillsHtml += '    <div class="sector-pill"><b>' + esc(etf.etf_name) + ' (' + esc(etf.etf_code) + ')</b> <span class="badge ' + getChgTag(etf.etf_chg) + '" style="margin-left:2px">' + esc(etf.etf_chg) + '</span></div>';
    }
  });
  if(!sectorPillsHtml){
    quotesList.slice(0, 6).forEach(function(q){
      sectorPillsHtml += '    <div class="sector-pill"><b>' + esc(q.name) + '</b> <span class="badge ' + getChgTag(q.chg) + '" style="margin-left:2px">' + esc(q.chg) + '</span></div>';
    });
  }
  h += sectorPillsHtml;
  h += '  </div>';

  h += '  <div class="focus-sec-title" style="margin-top:4px">⚡ 持仓核心标的表现与关联重仓实时监测</div>';
  h += '  <div class="stock-grid">';

  var renderedCards = 0;
  var ssByCode = {};
  ssList.forEach(function(s){ ssByCode[s.stock_code] = s; });

  // 4.1 优先展示用户实际持股
  heldStocks.slice(0, 6).forEach(function(q){
    var ss = ssByCode[q.code];
    var subLeft = ss ? ('Alpha ' + esc(ss.alpha)) : ('现价 ' + esc(q.price));
    var subStyle = ss ? ' style="color:var(--accent);font-weight:700"' : '';
    var sessTag = (node === '12:00') ? '午盘' : (node === '09:00' ? '昨收' : '收盘');
    h += '    <div class="s-mini-card"><div class="s-mini-top"><span class="s-mini-name">' + esc(q.name) + ' (' + esc(q.code) + ')</span><span class="badge ' + getChgTag(q.chg) + '">' + esc(q.chg) + '</span></div><div class="s-mini-bot"><span' + subStyle + '>' + subLeft + '</span><span class="badge b-closed">' + sessTag + '</span></div></div>';
    renderedCards++;
  });

  // 4.2 展示用户实际持仓 ETF 及其关联重仓海外映射（仅当用户持有对应 ETF 时渲染）
  var heldEtfCodes = {};
  heldEtfs.forEach(function(e){ heldEtfCodes[String(e.code).split('.')[0]] = true; });
  etfList.forEach(function(etf){
    if(renderedCards >= 8) return;
    h += '    <div class="s-mini-card"><div class="s-mini-top"><span class="s-mini-name">' + esc(etf.etf_name) + ' (' + esc(etf.etf_code) + ')</span><span class="badge ' + getChgTag(etf.etf_chg) + '">' + esc(etf.etf_chg) + '</span></div><div class="s-mini-bot"><span>场内 ' + esc(etf.etf_price) + '</span><span class="badge b-closed">持仓ETF</span></div></div>';
    renderedCards++;
    (etf.holdings || []).slice(0, 2).forEach(function(hld){
      if(renderedCards >= 8) return;
      var tag = hld.us_ticker ? ('[' + esc(hld.us_ticker) + ']') : esc(hld.code);
      h += '    <div class="s-mini-card"><div class="s-mini-top"><span class="s-mini-name">' + esc(hld.name) + ' ' + tag + '</span><span class="badge ' + getChgTag(hld.chg) + '">' + esc(hld.chg) + '</span></div><div class="s-mini-bot"><span>' + esc(etf.etf_name) + ' 权重 ' + esc(hld.weight) + '</span><span class="badge ' + (hld.session === 'PRE_MARKET' ? 'b-pre' : 'b-closed') + '">' + (hld.session === 'PRE_MARKET' ? '⚡盘前' : '穿透成分') + '</span></div></div>';
      renderedCards++;
    });
  });

  // 4.3 若有未被 etfList 覆盖的持仓 ETF，直接展示其行情卡片
  var etfListCodes = {};
  etfList.forEach(function(e){ etfListCodes[e.etf_code] = true; });
  heldEtfs.forEach(function(q){
    if(renderedCards >= 8 || etfListCodes[q.code]) return;
    h += '    <div class="s-mini-card"><div class="s-mini-top"><span class="s-mini-name">' + esc(q.name) + ' (' + esc(q.code) + ')</span><span class="badge ' + getChgTag(q.chg) + '">' + esc(q.chg) + '</span></div><div class="s-mini-bot"><span>现价 ' + esc(q.price) + '</span><span class="badge b-closed">持仓ETF</span></div></div>';
    renderedCards++;
  });

  // 4.4 仅在持仓涉及对应跨境ETF/美股，或总卡片不足3个时补充外盘核心风向标
  var relevantUsSyms = {};
  if(heldEtfCodes['513390'] || heldEtfCodes['513310']){
    relevantUsSyms['NVDA'] = true; relevantUsSyms['AAPL'] = true; relevantUsSyms['MSFT'] = true;
  }
  if(heldEtfCodes['513050']){
    relevantUsSyms['PDD'] = true; relevantUsSyms['KWEB'] = true;
  }
  heldStocks.forEach(function(q){
    if(q.market === 'US' && q.code) relevantUsSyms[q.code] = true;
  });
  usMovers.forEach(function(m){
    if(renderedCards >= 8) return;
    if(relevantUsSyms[m.symbol]){
      h += '    <div class="s-mini-card"><div class="s-mini-top"><span class="s-mini-name">🇺🇸 ' + esc(m.name) + ' (' + esc(m.symbol) + ')</span><span class="badge ' + getChgTag(m.chg) + '">' + esc(m.chg) + '</span></div><div class="s-mini-bot"><span>' + (m.session === 'REGULAR' ? '实盘 $' : '盘前 $') + esc(m.price) + '</span><span class="badge ' + (m.session === 'REGULAR' ? 'b-live' : 'b-pre') + '">' + (m.session === 'REGULAR' ? '⚡实盘' : '⚡盘前') + '</span></div></div>';
      renderedCards++;
    }
  });

  h += '  </div>';
  h += '</div>';

  // 5. 持仓全景透视 (Tab 切换卡片 - 动态数量与内容)
  var covList = d.coverage || [];
  var gapCovs = covList.filter(function(c){ return c.net === 'none'; });
  var stockTabCount = ssList.length > 0 ? Math.max(ssList.length, heldStocks.length) : heldStocks.length;
  var etfTabCount = Math.max(etfList.length, heldEtfs.length);
  var defaultEtfActive = (stockTabCount === 0 && etfTabCount > 0);
  var stockRowBadge = (node === '12:00') ? '午盘' : (node === '09:00' ? '昨收/盘前' : '收盘');

  h += '<div class="sec-head">';
  h += '  <span>💼 持仓资产穿透与 Alpha 全貌</span>';
  h += '  <span style="font-size:11px;color:var(--sub);font-weight:normal">有效覆盖 ' + esc(quotesList.length) + ' 只' + (gapCovs.length ? ' ｜ 缺失 ' + esc(gapCovs.length) + ' 只' : '') + '</span>';
  h += '</div>';

  if(gapCovs.length){
    h += '<div class="d-bullet alert" style="margin-bottom:8px">';
    h += '  <span class="d-tag" style="color:var(--up)">⚠️ 暂未获取/停牌 (' + esc(gapCovs.length) + '):</span>';
    h += '  <div>' + gapCovs.map(function(g){ return esc(g.name || g.code) + ' (' + esc(g.code) + ')：' + esc(g.note || '未获取'); }).join('；') + '</div>';
    h += '</div>';
  }

  h += '<div class="cockpit-card">';
  h += '  <div class="cockpit-tabs">';
  h += '    <button class="cockpit-tab' + (defaultEtfActive ? '' : ' active') + '" onclick="switchPortTab(\'tab-stocks\')">持仓核心个股 (' + stockTabCount + '只 · Alpha透视)</button>';
  h += '    <button class="cockpit-tab' + (defaultEtfActive ? ' active' : '') + '" onclick="switchPortTab(\'tab-etfs\')">持仓 ETF 深度穿透 (' + etfTabCount + '只 · 权重映射)</button>';
  h += '  </div>';

  // Tab 1: 个股 Alpha 透视
  h += '  <div class="cockpit-content" id="tab-stocks"' + (defaultEtfActive ? ' style="display:none"' : '') + '>';
  if(ssList.length === 0 && heldStocks.length === 0){
    h += '    <div class="stock-card-row"><div class="stock-hint">当前持仓组合未配置个股，全部为指数/行业 ETF 配置。</div></div>';
  }else{
    var renderedStockCodes = {};
    ssList.forEach(function(s){
      renderedStockCodes[s.stock_code] = true;
      var alphaVal = s.alpha_val || 0;
      var alphaBg = alphaVal > 0 ? 'var(--accentbg)' : 'var(--upbg)';
      var alphaColor = alphaVal > 0 ? 'var(--accent)' : 'var(--up)';

      h += '    <div class="stock-card-row">';
      h += '      <div class="stock-line-1">';
      h += '        <div><b>' + esc(s.stock_name) + '</b> <span class="code">' + esc(s.stock_code) + '</span> <span class="badge b-closed">' + stockRowBadge + '</span></div>';
      h += '        <div><span class="price num">' + esc(s.stock_price) + '</span> <span class="badge ' + getChgTag(s.stock_chg) + '">' + esc(s.stock_chg) + '</span></div>';
      h += '      </div>';
      h += '      <div class="stock-line-2">';
      h += '        <span>基准: ' + esc(s.sector_name) + ' (' + esc(s.sector_chg) + ')</span>';
      h += '        <span class="badge" style="background:' + alphaBg + ';color:' + alphaColor + ';font-weight:700">超额 Alpha ' + esc(s.alpha) + '</span>';
      h += '        <span>行业: ' + esc(s.industry) + '</span>';
      h += '      </div>';
      h += '      <div class="stock-hint">💡 <b>研判定调:</b> ' + esc(s.linkage) + '</div>';
      h += '    </div>';
    });
    heldStocks.forEach(function(q){
      if(renderedStockCodes[q.code]) return;
      h += '    <div class="stock-card-row">';
      h += '      <div class="stock-line-1">';
      h += '        <div><b>' + esc(q.name) + '</b> <span class="code">' + esc(q.code) + '</span> <span class="badge b-closed">' + esc(q.market || stockRowBadge) + '</span></div>';
      h += '        <div><span class="price num">' + esc(q.price) + '</span> <span class="badge ' + getChgTag(q.chg) + '">' + esc(q.chg) + '</span></div>';
      h += '      </div>';
      h += '      <div class="stock-line-2"><span>来源: ' + esc(q.src || '实时行情') + '</span><span>时点: ' + esc(q.asof || '') + '</span></div>';
      h += '    </div>';
    });
  }
  h += '  </div>';

  // Tab 2: ETF 重仓穿透 + 未映射ETF基础行情
  h += '  <div class="cockpit-content" id="tab-etfs"' + (defaultEtfActive ? '' : ' style="display:none"') + '>';
  if(etfList.length === 0 && heldEtfs.length === 0){
    h += '    <div class="etf-block"><div class="etf-driving">当前持仓组合未配置 ETF 基金。</div></div>';
  }else{
    var renderedEtfCodes = {};
    etfList.forEach(function(etf){
      renderedEtfCodes[etf.etf_code] = true;
      h += '    <div class="etf-block">';
      h += '      <div class="etf-top">';
      h += '        <span class="etf-title">' + esc(etf.etf_name) + ' (' + esc(etf.etf_code) + ') <span class="badge ' + getChgTag(etf.etf_chg) + '">' + esc(etf.etf_price) + ' (' + esc(etf.etf_chg) + ')</span></span>';
      h += '        <span class="badge b-closed">场内ETF</span>';
      h += '      </div>';
      h += '      <div class="etf-driving"><b>驱动归因：</b>' + esc(etf.driving) + '</div>';
      h += '      <div class="etf-chips">';
      (etf.holdings || []).forEach(function(hld){
        var usTickerBadge = hld.us_ticker ? ' <span style="font-size:9.5px;color:var(--accent)">[' + esc(hld.us_ticker) + ']</span>' : '';
        h += '        <span class="holding-chip"><b>' + esc(hld.name) + '</b>' + usTickerBadge + ' ' + esc(hld.weight) + ' <span class="badge ' + getChgTag(hld.chg) + '">' + esc(hld.chg) + '</span></span>';
      });
      h += '      </div>';
      h += '    </div>';
    });
    heldEtfs.forEach(function(q){
      var rawEtfCode = String(q.code || '').split('.')[0];
      if(renderedEtfCodes[q.code] || renderedEtfCodes[rawEtfCode]) return;
      h += '    <div class="etf-block">';
      h += '      <div class="etf-top">';
      h += '        <span class="etf-title">' + esc(q.name) + ' (' + esc(q.code) + ') <span class="badge ' + getChgTag(q.chg) + '">' + esc(q.price) + ' (' + esc(q.chg) + ')</span></span>';
      h += '        <span class="badge b-closed">场内ETF</span>';
      h += '      </div>';
      h += '      <div class="etf-driving"><b>驱动归因：</b>实时量价跟踪中（暂无预置重仓权重明细）</div>';
      h += '    </div>';
    });
  }
  h += '  </div>';
  h += '</div>';

  // 6. 影响市场的重大消息 (精选高信号, 不求全而求精)
  h += '<div class="sec-head">';
  h += '  <span>📢 影响市场的重大要闻 (精选高信号)</span>';
  h += '  <span style="font-size:11px;color:var(--sub);font-weight:normal">不求全而求精 ｜ 驱动归因</span>';
  h += '</div>';

  h += '<div class="major-news-list">';
  if(!msgs.length){
    h += '  <div class="news-item"><div class="news-body">当前时段无异常重大要闻。</div></div>';
  }else{
    msgs.forEach(function(m, idx){
      var impactClass = (m.dir === 'up' || m.strength === '强') ? 'impact-high' : 'impact-med';
      var safeUrl = (m.url && /^https?:\/\//i.test(m.url)) ? esc(m.url) : '';

      var linkHtml = safeUrl ? ' ｜ <a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">信源↗</a>' : '';

      h += '  <div class="news-item ' + impactClass + '">';
      h += '    <div class="news-top">';
      h += '      <span class="news-title">' + esc(m.codes || '核心要闻') + ' ｜ ' + esc(m.nature || '研判推演') + '</span>';
      h += '      <span class="news-meta">' + esc(m.time || '') + ' ｜ ' + esc(m.source || '官方数据') + linkHtml + '</span>';
      h += '    </div>';
      h += '    <div class="news-body">' + esc(m.content) + '</div>';
      if(m.impact){
        h += '    <div class="news-impact">🎯 <b>A股影响：</b>' + esc(m.impact) + '</div>';
      }
      if(m.chain){
        h += '    <div class="chain-inline"><span>传导链：' + esc(m.chain) + '</span></div>';
      }
      h += '  </div>';
    });
  }
  h += '</div>';

  // 6.1 可折叠 7x24 实时要闻明细（全量溯源）
  var liveNews = d.news || [];
  if(liveNews.length){
    h += '<details style="margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px">';
    h += '  <summary style="cursor:pointer;font-size:11.5px;font-weight:700;color:var(--ink)">📰 7x24 实时快讯原始流溯源（共 ' + esc(liveNews.length) + ' 条，点击展开）</summary>';
    h += '  <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">';
    liveNews.forEach(function(n){
      var nUrl = (n.url && /^https?:\/\//i.test(n.url)) ? esc(n.url) : '';
      var nTag = n.codes ? ' <span class="badge tag-neu">' + esc(n.codes) + '</span>' : '';
      h += '    <div style="font-size:11px;line-height:1.45;padding:5px 7px;background:var(--card-subtle);border-radius:var(--radius-sm)">';
      h += '      <div style="display:flex;justify-content:space-between;gap:6px;margin-bottom:2px;color:var(--sub);font-size:10px"><span>[' + esc(n.time || '') + '] ' + esc(n.source || '') + nTag + '</span>' + (nUrl ? '<a href="' + nUrl + '" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">原文↗</a>' : '') + '</div>';
      h += '      <div>' + esc(n.content || '') + '</div>';
      h += '    </div>';
    });
    h += '  </div>';
    h += '</details>';
  }else{
    h += '<div style="margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:11px;color:var(--sub)">📰 7x24 实时快讯原始流溯源：本时段无增量直接快讯，已切换为纯盘面量价与外盘估值跟踪模式。</div>';
  }

  // 7. 尾部声明与免责
  h += '<div style="margin-top:20px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--sub);text-align:center">';
  h += '  本页面由 Antigravity 自动化监控组件实时生成 (v2.3 移动端极简版) ｜ 仅供投研参考，不构成投资建议。';
  h += '</div>';

  document.getElementById('app').innerHTML = h;

  // 全局交互函数绑定
  window.switchIdx = function(paneId){
    var panes = document.querySelectorAll('.idx-pane');
    panes.forEach(function(p){ p.classList.remove('active'); });
    var target = document.getElementById(paneId);
    if(target) target.classList.add('active');

    var tabs = document.querySelectorAll('.idx-tab');
    tabs.forEach(function(t){ t.classList.remove('active'); });
    if(window.event && window.event.currentTarget){
      window.event.currentTarget.classList.add('active');
    }
  };

  window.switchPortTab = function(tabId){
    var sTab = document.getElementById('tab-stocks');
    var eTab = document.getElementById('tab-etfs');
    if(sTab) sTab.style.display = (tabId === 'tab-stocks' ? 'block' : 'none');
    if(eTab) eTab.style.display = (tabId === 'tab-etfs' ? 'block' : 'none');
    var tabs = document.querySelectorAll('.cockpit-tab');
    if(tabs.length >= 2){
      tabs[0].classList.toggle('active', tabId === 'tab-stocks');
      tabs[1].classList.toggle('active', tabId === 'tab-etfs');
    }
  };

  window.copyBrief = function(){
    var txt = '【📊 财经快讯 · 盯盘与预测 (' + (d.node || '') + ' ' + (d.period || '') + ')】\n';
    if(d.focus) txt += '🎯 核心定调：' + d.focus + '\n';
    if(d.summary) txt += '📊 态势归因：' + d.summary + '\n';
    txt += '----------------------------\n';
    (d.messages || []).forEach(function(m){
      txt += '• [' + (m.codes || '要闻') + '] ' + (m.impact || m.content) + '\n';
    });
    txt += '----------------------------\n公网研报：https://pages.242556.xyz/\n以上为公开信息汇总，仅供参考。';

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        var btn = document.getElementById('btn-copy');
        if(btn){
          var old = btn.innerText;
          btn.innerText = '✓ 已复制';
          setTimeout(function(){ btn.innerText = old; }, 2000);
        }
      });
    }else{
      alert('已生成速报文本：\n\n' + txt);
    }
  };
})();
</script>
</body>
</html>
